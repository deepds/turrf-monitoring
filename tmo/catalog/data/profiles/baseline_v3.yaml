# Методика расчёта, версия baseline_v3.
#
# Почему сразу третья, минуя вторую. `baseline_v2` был зарегистрирован
# 12.08.2026 ради сравнительного расчёта — и списки категорий в нём отсеивали
# обычные номера: слово, описывающее корпус («Стандарт, корпус Невский»,
# «Двухместный номер Standard Мансарда»), принималось за категорию номера.
# Замер показал 9 903 таких предложения, 2,7 % выборки.
#
# К моменту, когда это выяснилось, на v2 уже сослался расчёт, и правка на месте
# запрещена проверкой неизменяемости — она сработала правильно. Исправленные
# правила стали новой версией, а v2 остался в базе таким, каким считал: он
# ничего не публиковал и живёт только как след того замера.
#
#
# Активная версия неизменяема. Любое изменение правила — это НОВЫЙ файл с новой
# версией; старые CalculationRun продолжают ссылаться на прежнюю. Пересчитать
# старый снимок новой методикой можно, переписать старый расчёт — нельзя
# (SCOPE-R R2).
#
# Отличия от baseline_v1 — ровно два, оба в отборе:
#
#   1. ЖД: к купе добавлены сидячие места скоростных поездов из списка
#      `high_speed_seated_trains`. Замер на снимке 10.08.2026 показал сдвиг
#      медианы Москва — Петербург на +3,5 % в среднем, от −6,3 % до +15,1 %:
#      схлопывание тарифной сетки берёт с поезда самый дешёвый билет, поэтому
#      бизнес-класс «Сапсана» за 103 000 ₽ в выборку не попадает.
#
#   2. Проживание: включён отсев категорий номера вне методики по названию.
#      Замер там же: медиана падает на 1,6 % в среднем, разброс от −14,2 % до
#      +11,8 % по краям. Отсеиваются 13,9 % выборки — в основном апарт-отели,
#      студии и квартиры, прошедшие мимо фильтра типа размещения, плюс бизнес-
#      категории и размещение не в отдельном номере.
#
#      Цена правила: 99 метрик остаются без единого предложения, ещё 1 042 —
#      с выборкой меньше пяти. Это уронит их уверенность, и так и должно быть:
#      метрика, посчитанная по трём номерам, рынок описывает плохо.
#
#      Известная погрешность: 0,03 % названий вида «корпус Люкс "Стандарт с
#      балконом"» отсеиваются ошибочно — класс в имени корпуса неотличим от
#      класса номера. Мерилось: 104 предложения из 360 688, и половина из них
#      («Трёхместный люкс в коттедже Дуплекс») исключается верно.
#
# Всё остальное скопировано из baseline_v1 без изменений.

version: baseline_v3
title: Скоростные сидячие в ЖД, отсев категорий номера в проживании
effective_from: 2026-08-12
description: >
  Расширение baseline_v1 по двум просьбам заказчика: сидячие места скоростных
  поездов включаются в наблюдаемый ЖД-рынок наравне с купе, а из проживания
  убираются номера дорогих категорий. Пороги выборки, уверенности и публикации
  не менялись: сравнение с baseline_v1 показывает эффект правил отбора, а не
  сдвиг порогов.

# --------------------------------------------------------------------------
# Отбор: какие предложения вообще являются наблюдением рынка
# --------------------------------------------------------------------------
selection:
  rail:
    passenger_count: 1
    direct_only: true
    # Тип вагона, а не сервисный класс. `2К`/`2Д` — это ServiceClass, и
    # обязательный фильтр по ним отбрасывал больше половины купейных
    # предложений РЖД (DATA_PIPELINE_PLAYBOOK, шаг 3).
    car_types: [COMPARTMENT]
    # Сидячие места скоростных поездов допускаются дополнительно — и только у
    # поездов из этого списка.
    #
    # Отбирать по типу вагона нельзя: `SEDENTARY` объединяет «Сапсан» со
    # средней ценой 17 323 ₽ и пригородный сидячий вагон за 292 ₽. Разброс
    # внутри типа — в пятьдесят раз, и медиана по нему описывала бы не рынок,
    # а состав выдачи. Имя поезда приходит только от РЖД; Туту сидячие места
    # не отдаёт вовсе, поэтому эта часть выборки одноисточниковая.
    #
    # Список именно здесь, а не в коде: добавить «Ласточку» — правка строки.
    high_speed_seated_trains:
      - САПСАН
    service_class: ANY
    trip_type: ONE_WAY
    # Места целевого назначения не являются рыночным предложением: два места
    # по льготной цене занижали наблюдаемый минимум.
    exclude_disabled_places_groups: true
    exclude_sale_forbidden: true
    # Вагон без мест в продаже: цена справочная, купить по ней нельзя.
    require_places_available: true
    # Из нескольких тарифных строк одного поезда в расчёт идёт одна — самая
    # дешёвая подходящая. Иначе медиана описывает тарифную сетку, а не выбор
    # пассажира: РЖД отдаёт до пяти купейных групп на поезд, а у «Сапсана»
    # тарифных строк ещё больше.
    fare_collapse: CHEAPEST_PER_TRAIN

  air:
    passenger_count: 1
    cabin: ECONOMY
    direct_only: true
    refundable: false
    airlines: ALL
    trip_type: ROUND_TRIP
    # Один физический itinerary учитывается один раз, по минимальному
    # подходящему тарифу. Тарифные семейства сохраняются для provenance.
    fare_collapse: CHEAPEST_PER_ITINERARY
    # Складывать два one-way в «круговой» запрещено методикой, а не настройкой:
    # флага, который это разрешает, здесь нет намеренно.

  hotel:
    adults: 1
    rooms: 1
    property_types: [HOTEL]
    stars: [3, 4, 5]
    meal_filter: NONE
    # Категория номера. Источник не отдаёт её отдельным полем: ни в выдаче
    # поиска, ни в деталях предложения нет ни `category`, ни `class`. Класс
    # закодирован словом внутри названия — Economy, Standard, Deluxe, люкс, —
    # и название остаётся единственным доступным признаком.
    room_category_filter: EXCLUDE_PREMIUM
    # Сравнение регистронезависимое и выполняется в Python. В SQL его делать
    # нельзя: база создана с `--locale=C`, и `ILIKE '%стандарт%'` не находит
    # «Стандарт» — правило молча не нашло бы ничего.
    #
    # Списки подобраны на выборке снимка 10.08.2026 — 360 688 предложений,
    # 2 518 различных названий. Итог: 84,6 % базовых, 13,9 % вне методики,
    # 1,3 % неопознанных, 0,1 % без названия.
    #
    # Вне методики — не только дорогое. Сюда же «Кровать в 4-местном общем
    # номере» и «1-местная капсула»: это не отдельный номер, и цена за место
    # не сопоставима с ценой за номер.
    excluded_room_keywords:
      - люкс
      - полулюкс
      - делюкс
      - deluxe
      - сьют
      - сюит
      - suite
      - джуниор
      - junior
      - бизнес
      - business
      - премиум
      - premium
      - апартамент
      - апарт
      - студи
      - студио
      - studio
      - дюплекс
      - пентхаус
      # Слов, описывающих ЗДАНИЕ, здесь намеренно нет: «коттедж», «вилла»,
      # «таунхаус», «шале», «корпус», «мансарда». Тип размещения отсеивается
      # своей ступенью, а в названии номера такое слово почти всегда говорит о
      # корпусе, а не о классе.
      #
      # Замер: с ними правило выбрасывало 9 903 предложения (2,7 % выборки) с
      # названиями «Двухместный номер Standard Мансарда», «Стандарт сингл
      # (корпус Luciano Vita Club)», «Стандарт, корпус Невский» — обычные
      # стандарты. В Golden Dataset так же уходил «2-Х МЕСТН. ЭКОНОМ ...
      # (коттедж 1 ЭТАЖ)» за 1 999 ₽, и минимум выборки подскакивал до 2 900.
      - кровать в
      - место в
      - койко
      - общем номере
      - общий номер
      - кубрик
      - капсула
      - квартира
      - хостел
    # Базовые категории и обычные номера, названные по вместимости. Последнее
    # обязательно: «Одноместный номер» встретился 2 843 раза, и это самый
    # обычный номер, а не спорный случай. Без слов вместимости правило
    # выбрасывало бы 7,6 % выборки вместо 1,2 %.
    allowed_room_keywords:
      - стандарт
      - standard
      - standart
      - эконом
      - economy
      - бюджет
      - комфорт
      - comfort
      - улучшен
      - superior
      - супериор
      - класси
      - classic
      - базов
      - одноместн
      - двухместн
      - трёхместн
      - трехместн
      - четырёхместн
      - четырехместн
      - местн
      - номер
      - комната
    # Название, в котором не опознана ни та, ни другая категория, в расчёт не
    # идёт. Это 1,2 % выборки: «Панорама Роял», «Персиковый», «Нео Типи» —
    # собственные имена номеров, по которым категорию не восстановить. Взять
    # спорное дешевле не выйдет: люкс, попавший в медиану молча, дороже
    # потерянного наблюдения.
    on_unknown_room_category: EXCLUDE
    # Источник принимает фильтр типа объекта, но не возвращает тип в выдаче.
    # Поэтому отсев двухступенчатый: аргументом запроса и локальной проверкой
    # по названию категории номера — единственному признаку, который доходит.
    local_property_type_check: true
    # Если источник не подтвердил применение серверного фильтра в
    # meta.filters_applied, выборка помечается предупреждением, а не молча
    # считается гостиничной.
    require_server_filter_confirmation: true
    fare_collapse: CHEAPEST_PER_PROPERTY

# --------------------------------------------------------------------------
# Агрегация
# --------------------------------------------------------------------------
aggregation:
  primary_metric: median
  secondary_metric: min
  currency: RUB
  # Медиана чётной выборки: среднее двух центральных значений.
  median_method: AVERAGE_OF_MIDDLE_TWO

outliers:
  # При малой выборке агрессивная чистка выбросов удаляет рынок, а не шум.
  min_sample_for_removal: 8
  method: IQR
  iqr_multiplier: 3.0
  # Верхняя граница доли отбрасываемого: если правило хочет убрать больше,
  # выборка признаётся неоднородной и не чистится, а помечается.
  max_removed_share: 0.25

# --------------------------------------------------------------------------
# Качество и уверенность
# --------------------------------------------------------------------------
quality:
  weights:
    sample: 0.40
    sources: 0.20
    completeness: 0.25
    freshness: 0.15

  # Размер выборки, при котором компонент считается полным. Разный по
  # семействам: на направлении ходит 2–15 поездов, и требовать от ЖД
  # тридцати предложений значило бы объявить исправное наблюдение плохим.
  target_sample_size:
    RAIL: 6
    AIR: 12
    HOTEL: 25

  # Ожидаемое число источников. Для авиа и проживания источник один по
  # составу MVP, и это не является поводом для LOW.
  expected_sources:
    RAIL: 2
    AIR: 1
    HOTEL: 1

  # Свежесть считается от fetched_at, не от даты снимка.
  fresh_minutes: 720
  stale_minutes: 1440

confidence:
  high_min_score: 0.75
  medium_min_score: 0.45
  # Жёсткие понижения, которые действуют независимо от балла.
  min_offers_for_high:
    RAIL: 3
    AIR: 6
    HOTEL: 10
  min_offers_for_medium:
    RAIL: 2
    AIR: 3
    HOTEL: 4
  # Ниже этого числа предложений метрика публикуется с LOW и явной пометкой.
  min_offers_to_publish: 1
  # Обрезанная выдача не может быть HIGH: медиана смещена неизвестно куда.
  partial_caps_at_medium: true
  # Технический отказ одного из источников наблюдения тоже не даёт HIGH:
  # выборка собрана не тем составом источников, каким планировалась, и
  # сравнить её не с чем.
  source_failure_caps_at_medium: true
  # Расхождение медиан источников свыше доли — предупреждение, не ошибка:
  # РЖД отдаёт тариф перевозчика, Туту — цену агента, разрыв объясним.
  source_disagreement_threshold: 0.35

# --------------------------------------------------------------------------
# Публикация снимка
# --------------------------------------------------------------------------
publication:
  # Доля завершённых наблюдений от запланированных. NO_MARKET считается
  # завершённым: отсутствие сообщения — это ответ о рынке.
  ready_completion: 0.98
  degraded_completion: 0.85
  # Отдельно по семействам: полная авиа при мёртвом ЖД не должна выглядеть
  # исправным снимком.
  ready_completion_by_family:
    RAIL: 0.98
    AIR: 0.95
    HOTEL: 0.95
  degraded_completion_by_family:
    RAIL: 0.85
    AIR: 0.75
    HOTEL: 0.75
  # Доля наблюдений с данными (SUCCESS/PARTIAL) от завершённых. Защищает от
  # снимка, где всё «завершено» как NO_MARKET из-за сломанного парсера.
  min_data_share: 0.50
  # Критические правила валидации: любое нарушение блокирует публикацию.
  #
  # `RAIL_COMPARTMENT_ONLY` сохраняет историческое имя, а проверяет теперь
  # соответствие профилю: под baseline_v2 она пропускает и сидячие места
  # поездов из `high_speed_seated_trains`. Переименовать нельзя, не сломав
  # этот же список у baseline_v1: правило, которое код перестал испускать,
  # молча перестало бы проверяться.
  critical_validation_rules:
    - PRICE_POSITIVE
    - CURRENCY_MATCHES_PROFILE
    - ROUTE_MATCHES_REQUEST
    - DATES_MATCH_REQUEST
    - RAIL_COMPARTMENT_ONLY
    - AIR_DIRECT_ONLY
    - AIR_ROUND_TRIP_NOT_SYNTHESIZED
    - HOTEL_PROPERTY_TYPE_ALLOWED
    - HOTEL_STARS_ALLOWED
    - HOTEL_ROOM_CATEGORY_ALLOWED
    - HOTEL_STAY_NOT_DERIVED_FROM_NIGHTS
    - NO_DUPLICATE_EQUIVALENCE_KEY
    - PAGINATION_STATUS_KNOWN

# --------------------------------------------------------------------------
# Расчёт стоимости поездки (блок «Куда ехать»)
# --------------------------------------------------------------------------
trip_cost:
  # Круговой авиатариф наблюдается напрямую; арифметическая сумма двух
  # односторонних тарифов круговым тарифом не является.
  air: REAL_ROUND_TRIP_PLUS_REAL_STAY
  # ЖД наблюдается плечами: перевозчик продаёт билет в одну сторону.
  # Сумма двух отдельно наблюдавшихся плеч помечается в UI как сумма.
  rail: OUTBOUND_LEG_PLUS_RETURN_LEG_PLUS_REAL_STAY
  # Проживание — настоящая multi-night бронь на пару дат поездки.
  # Умножение цены одной ночи на число ночей запрещено методикой.
  accommodation: REAL_MULTI_NIGHT_QUERY
  label: Расчётная стоимость поездки
