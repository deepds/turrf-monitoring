# Методика расчёта, версия baseline_v1.
#
# Активная версия неизменяема. Любое изменение правила — это НОВЫЙ файл с новой
# версией; старые CalculationRun продолжают ссылаться на прежнюю. Пересчитать
# старый снимок новой методикой можно, переписать старый расчёт — нельзя
# (SCOPE-R R2).
#
# Все пороги живут здесь, а не в коде: порог в коде меняет историю незаметно.

version: baseline_v1
title: Базовая методика MVP
effective_from: 2026-08-07
description: >
  Первая версия методики второй системы. Пороги выборки и уверенности
  откалиброваны по замерам источников 07.08.2026: ЖД-рынок мал по природе
  (2–15 поездов на направление), авиа и проживание упираются в потолок выдачи.

# --------------------------------------------------------------------------
# Отбор: какие предложения вообще являются наблюдением рынка
# --------------------------------------------------------------------------
selection:
  rail:
    passenger_count: 1
    direct_only: true
    # Тип вагона, а не сервисный класс. `2К`/`2Д` — это ServiceClass, и
    # обязательный фильтр по ним отбрасывал больше половины купейных
    # предложений РЖД (DATA_PIPELINE_PLAYBOOK, шаг 3).
    car_type: COMPARTMENT
    service_class: ANY
    trip_type: ONE_WAY
    # Места целевого назначения не являются рыночным предложением: два места
    # по льготной цене занижали наблюдаемый минимум.
    exclude_disabled_places_groups: true
    exclude_sale_forbidden: true
    # Вагон без мест в продаже: цена справочная, купить по ней нельзя.
    require_places_available: true
    # Из нескольких купейных тарифных строк одного поезда в расчёт идёт одна —
    # самая дешёвая подходящая. Иначе медиана описывает тарифную сетку, а не
    # выбор пассажира: РЖД отдаёт до пяти купейных групп на поезд.
    fare_collapse: CHEAPEST_PER_TRAIN

  air:
    passenger_count: 1
    cabin: ECONOMY
    direct_only: true
    refundable: false
    airlines: ALL
    trip_type: ROUND_TRIP
    # Один физический itinerary учитывается один раз, по минимальному
    # подходящему тарифу. Тарифные семейства сохраняются для provenance.
    fare_collapse: CHEAPEST_PER_ITINERARY
    # Складывать два one-way в «круговой» запрещено методикой, а не настройкой:
    # флага, который это разрешает, здесь нет намеренно.

  hotel:
    adults: 1
    rooms: 1
    property_types: [HOTEL]
    stars: [3, 4, 5]
    meal_filter: NONE
    room_category_filter: NONE
    # Источник принимает фильтр типа объекта, но не возвращает тип в выдаче.
    # Поэтому отсев двухступенчатый: аргументом запроса и локальной проверкой
    # по названию категории номера — единственному признаку, который доходит.
    local_property_type_check: true
    # Если источник не подтвердил применение серверного фильтра в
    # meta.filters_applied, выборка помечается предупреждением, а не молча
    # считается гостиничной.
    require_server_filter_confirmation: true
    fare_collapse: CHEAPEST_PER_PROPERTY

# --------------------------------------------------------------------------
# Агрегация
# --------------------------------------------------------------------------
aggregation:
  primary_metric: median
  secondary_metric: min
  currency: RUB
  # Медиана чётной выборки: среднее двух центральных значений.
  median_method: AVERAGE_OF_MIDDLE_TWO

outliers:
  # При малой выборке агрессивная чистка выбросов удаляет рынок, а не шум.
  min_sample_for_removal: 8
  method: IQR
  iqr_multiplier: 3.0
  # Верхняя граница доли отбрасываемого: если правило хочет убрать больше,
  # выборка признаётся неоднородной и не чистится, а помечается.
  max_removed_share: 0.25

# --------------------------------------------------------------------------
# Качество и уверенность
# --------------------------------------------------------------------------
quality:
  weights:
    sample: 0.40
    sources: 0.20
    completeness: 0.25
    freshness: 0.15

  # Размер выборки, при котором компонент считается полным. Разный по
  # семействам: на направлении ходит 2–15 поездов, и требовать от ЖД
  # тридцати предложений значило бы объявить исправное наблюдение плохим.
  target_sample_size:
    RAIL: 6
    AIR: 12
    HOTEL: 25

  # Ожидаемое число источников. Для авиа и проживания источник один по
  # составу MVP, и это не является поводом для LOW.
  expected_sources:
    RAIL: 2
    AIR: 1
    HOTEL: 1

  # Свежесть считается от fetched_at, не от даты снимка.
  fresh_minutes: 720
  stale_minutes: 1440

confidence:
  high_min_score: 0.75
  medium_min_score: 0.45
  # Жёсткие понижения, которые действуют независимо от балла.
  min_offers_for_high:
    RAIL: 3
    AIR: 6
    HOTEL: 10
  min_offers_for_medium:
    RAIL: 2
    AIR: 3
    HOTEL: 4
  # Ниже этого числа предложений метрика публикуется с LOW и явной пометкой.
  min_offers_to_publish: 1
  # Обрезанная выдача не может быть HIGH: медиана смещена неизвестно куда.
  partial_caps_at_medium: true
  # Технический отказ одного из источников наблюдения тоже не даёт HIGH:
  # выборка собрана не тем составом источников, каким планировалась, и
  # сравнить её не с чем.
  source_failure_caps_at_medium: true
  # Расхождение медиан источников свыше доли — предупреждение, не ошибка:
  # РЖД отдаёт тариф перевозчика, Туту — цену агента, разрыв объясним.
  source_disagreement_threshold: 0.35

# --------------------------------------------------------------------------
# Публикация снимка
# --------------------------------------------------------------------------
publication:
  # Доля завершённых наблюдений от запланированных. NO_MARKET считается
  # завершённым: отсутствие сообщения — это ответ о рынке.
  ready_completion: 0.98
  degraded_completion: 0.85
  # Отдельно по семействам: полная авиа при мёртвом ЖД не должна выглядеть
  # исправным снимком.
  ready_completion_by_family:
    RAIL: 0.98
    AIR: 0.95
    HOTEL: 0.95
  degraded_completion_by_family:
    RAIL: 0.85
    AIR: 0.75
    HOTEL: 0.75
  # Доля наблюдений с данными (SUCCESS/PARTIAL) от завершённых. Защищает от
  # снимка, где всё «завершено» как NO_MARKET из-за сломанного парсера.
  min_data_share: 0.50
  # Критические правила валидации: любое нарушение блокирует публикацию.
  critical_validation_rules:
    - PRICE_POSITIVE
    - CURRENCY_MATCHES_PROFILE
    - ROUTE_MATCHES_REQUEST
    - DATES_MATCH_REQUEST
    - RAIL_COMPARTMENT_ONLY
    - AIR_DIRECT_ONLY
    - AIR_ROUND_TRIP_NOT_SYNTHESIZED
    - HOTEL_PROPERTY_TYPE_ALLOWED
    - HOTEL_STARS_ALLOWED
    - HOTEL_STAY_NOT_DERIVED_FROM_NIGHTS
    - NO_DUPLICATE_EQUIVALENCE_KEY
    - PAGINATION_STATUS_KNOWN

# --------------------------------------------------------------------------
# Расчёт стоимости поездки (блок «Куда ехать»)
# --------------------------------------------------------------------------
trip_cost:
  # Круговой авиатариф наблюдается напрямую; арифметическая сумма двух
  # односторонних тарифов круговым тарифом не является.
  air: REAL_ROUND_TRIP_PLUS_REAL_STAY
  # ЖД наблюдается плечами: перевозчик продаёт билет в одну сторону.
  # Сумма двух отдельно наблюдавшихся плеч помечается в UI как сумма.
  rail: OUTBOUND_LEG_PLUS_RETURN_LEG_PLUS_REAL_STAY
  # Проживание — настоящая multi-night бронь на пару дат поездки.
  # Умножение цены одной ночи на число ночей запрещено методикой.
  accommodation: REAL_MULTI_NIGHT_QUERY
  label: Расчётная стоимость поездки
