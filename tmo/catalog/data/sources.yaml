# Реестр источников MVP. Новые источники в текущую итерацию не подключаются.
#
# `rate_limit_per_minute` и `concurrency` — наши значения, не опубликованные
# источником. Оба публичных сервиса лимиты не документируют; цифры получены
# замером и держат запас (SOURCES_PLAYBOOK, «Стоимость обращений»).

sources:
  - code: tutu_mcp
    name: Туту.ру
    protocol: MCP
    endpoint: https://mcp.tutu.ru/mcp
    allowed_hosts: [mcp.tutu.ru]
    families: [RAIL, AIR, HOTEL]
    requires_credentials: false
    price_semantics:
      RAIL: Цена агента за одно место в одну сторону, соответствует корзине.
      AIR: Круговой тариф за всех пассажиров запроса.
      HOTEL: Итог за весь период проживания и заданный состав гостей.
    # Замеры 07.08.2026, 16:00 MSK — пик для travel-сервиса:
    #   12 одновременных / 240 в минуту — 503 через минуты работы;
    #    8 одновременных / 120 в минуту — 503 через две минуты сбора;
    #    8 одновременных залпом на 8 обращений — без отказов.
    # Короткий залп сервис держит, устойчивый поток той же плотности — нет.
    #
    # Ночь 08.08.2026, первый полный автоматический прогон — ночные замеры:
    #    3 одновременных, ЖД, 9 минут       — 600 наблюдений, 0 отказов;
    #    3 одновременных, авиа, 50 минут    — 19 отказов 503;
    #    6 одновременных, проживание, 3 часа — 4 971 наблюдение, 0 отказов;
    #   12-15 одновременных (задача шла в пять копий) — 503, размыкания.
    #
    # Рабочая точка: 12 одновременных, 180 в минуту.
    #
    # Двенадцать — граница наблюдавшегося отказа, а не безопасное значение.
    # Шесть источник держал три часа подряд без единого 503; на 12-15 ночью
    # ломалось, и старый дневной замер на 12 давал 503 через минуты. Точка взята
    # сознательно на грани: окно 01:00-08:00 короче прежнего, и меньшая
    # одновременность в него не укладывается вовсе.
    #
    # Размен принят явно: дыры от отказов закрывает досбор. Его окно — час
    # между 08:00 и расчётом, этого хватает примерно на 1 700 наблюдений авиа.
    # Дыр больше — снимок выйдет неполным, и это будет видно в покрытии.
    #
    # ВАЖНО: выше десяти ограничителем становится не источник, а собственный
    # лимит темпа. При 6,26 обращения на авианаблюдение двенадцать потоков
    # просят около 215 обращений в минуту при разрешённых 180, а проживание
    # упирается в лимит уже на семи. Поэтому 12 даёт меньше, чем кажется:
    # по авиа примерно как 10, по проживанию — как 7.
    #
    # 503 приходят и на тройке (авиа), то есть зависят не только от числа
    # потоков: авиа читает 5-8 страниц подряд на наблюдение, и плотность
    # такого обхода источнику не нравится сама по себе. Одновременность эту
    # причину не лечит и не усугубляет.
    #
    # Время сбора линейно по одновременности: упираемся в задержку источника,
    # а не в лимит темпа. На шестёрке выходит около 90 обращений в минуту при
    # разрешённых 180 — лимит остаётся предохранителем, а не рабочей границей.
    # Он стал бы ею около десятки, и поднимать одновременность выше без правки
    # темпа бессмысленно: резать начнёт свой же лимит, раньше источника.
    #
    # Признак, что точка взята неверно: `circuit_waits` в итогах сбора. Каждая
    # пауза — пять минут ожидания остывания цепи. Больше двух-трёх за ночь
    # означает, что параллельность съедает больше, чем даёт.
    rate_limit_per_minute: 180
    concurrency: 12
    #  Потолок выдачи: page 1..10 × page_size 1..30 = 300 объектов.
    max_pages: 10
    page_size: 30
    is_enabled: true
    notes: >
      Публичный MCP без авторизации. Имена и границы аргументов читаются из
      tools/list во время выполнения: схема менялась между версиями сервера, и
      жёстко зашитое имя однажды перестаёт работать без всякой ошибки.

  - code: rzd
    name: РЖД
    protocol: REST
    endpoint: https://ticket.rzd.ru
    allowed_hosts: [ticket.rzd.ru]
    families: [RAIL]
    requires_credentials: false
    price_semantics:
      RAIL: Тариф перевозчика за одно место в одну сторону, без агентского сбора.
    rate_limit_per_minute: 90
    concurrency: 4
    max_pages: 1
    page_size: 0
    is_enabled: true
    notes: >
      Публичный путь prices/train-pricing устойчиво отвечает 500; используется
      B2B-путь /apib2b/p/Railway/V1/Search/TrainPricing с service_provider=B2B_RZD.
      Возможен двухфазный протокол с RID и опросом.

  - code: replay
    name: Воспроизведение записанных ответов
    protocol: REPLAY
    endpoint: ""
    allowed_hosts: []
    families: [RAIL, AIR, HOTEL]
    requires_credentials: false
    price_semantics:
      RAIL: Как у записанного источника.
      AIR: Как у записанного источника.
      HOTEL: Как у записанного источника.
    rate_limit_per_minute: 0
    concurrency: 32
    max_pages: 1
    page_size: 0
    is_enabled: false
    notes: >
      Не источник рынка. Отдаёт заранее записанные ответы для golden-тестов и
      демонстрации без сети. Снимок, собранный им, помечается
      is_synthetic=true и никогда не публикуется как наблюдение рынка.
