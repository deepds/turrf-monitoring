[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmo"
version = "2.0.0"
description = "Ежедневный мониторинг стоимости поездок между пятью ключевыми городами"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "freezegun>=1.5",
]

[project.scripts]
tmo = "tmo.cli:main"

[tool.setuptools.packages.find]
include = ["tmo*"]

[tool.setuptools.package-data]
tmo = ["catalog/data/*.yaml", "catalog/data/profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: требует живой PostgreSQL (TMO_TEST_DATABASE_URL)",
    "live: обращается к внешним источникам, по умолчанию пропускается",
    "capacity: длительный capacity benchmark",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 110, а не 88: комментарии на русском длиннее английских примерно в полтора
# раза, и перенос ради лимита рвёт фразу там, где она читается целиком.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
