name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL-набор обязателен: SQLite не воспроизводит JSONB, зону
        # времени, конкурентную запись и поведение внешних ключей.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tmo
          POSTGRES_PASSWORD: tmo
          POSTGRES_DB: tmo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: ruff check tmo tests scripts

      - name: Быстрые тесты (SQLite)
        env:
          # Сети в CI нет: любое обращение к источнику обязано падать, а не
          # молча висеть.
          TMO_SOURCES_ENABLED: "false"
        run: pytest -q -m "not postgres and not live and not capacity"

      - name: Golden Dataset
        run: pytest -q tests/test_golden.py

      - name: PostgreSQL integration
        env:
          TMO_TEST_DATABASE_URL: postgresql+psycopg://tmo:tmo@localhost:5432/tmo
        run: pytest -q -m postgres

      - name: Capacity
        run: pytest -q -m capacity

      - name: Проверка миграций против моделей
        env:
          TMO_DATABASE_URL: postgresql+psycopg://tmo:tmo@localhost:5432/tmo
        run: |
          alembic upgrade head
          # Расхождение миграции и модели ломает прод, а не тест.
          alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка backend-образа
        run: docker build -t travel-monitoring-observatory:ci .
      - name: Сборка UI-образа
        run: docker build -t travel-monitoring-observatory-ui:ci ./frontend
